<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELA Learning Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff1d3,#f9dce6);font:20px system-ui,sans-serif;color:#52132b}main{max-width:920px;margin:auto;padding:20px}header{background:#80132f;color:white;border-radius:24px;padding:22px;text-align:center;border:4px solid #e8b86d}h1{margin:6px;font-size:clamp(25px,5vw,40px)}small{font-size:15px}article{background:#fff9f2;border:3px solid #e8b86d;border-radius:24px;padding:22px;margin-top:16px;box-shadow:0 8px 0 #e8b86d66}.scene{background:linear-gradient(#d9f4ff,#fff0b8);border:3px solid white;border-radius:20px;text-align:center;padding:18px;font-size:clamp(42px,9vw,86px);letter-spacing:8px;min-height:130px}button{font:inherit;cursor:pointer;border:2px solid #e8b86d;border-radius:14px;padding:12px;background:#fff;color:#52132b;font-weight:650}button:focus-visible{outline:4px solid #1678a0}button:disabled{opacity:.55;cursor:default}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{text-align:left;min-height:85px;background:#fff3d2}.choice:nth-child(even){background:#ffe5eb}.correct{background:#d9f5d9!important;border-color:#248348}.wrong{background:#ffd9d9!important;border-color:#b52b43}.letter{display:inline-block;background:#80132f;color:white;border-radius:50%;width:30px;text-align:center;margin-right:8px}.bar{height:13px;background:#ead5d9;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#e5a62c;transition:width .3s}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}.primary{background:#80132f;color:white}.trail{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.trail button{font-size:13px;padding:5px;min-width:32px}.trail .current{outline:3px solid #80132f}.feedback{min-height:42px;padding:10px 0}h2{font-size:clamp(21px,4vw,28px)}@media(max-width:550px){.choices{grid-template-columns:1fr}main{padding:10px}article{padding:14px}}</style><main><header><small>WPA • ELA 2 • TERM 3 • WEEK 9</small><h1>📚 ELA Learning Adventure</h1><div>The 40-Star Challenge</div></header><article id="game"></article></main><script>const Q=[{"q": "Read: “The clerk fills empty shelves at night.” What does clerk mean here?", "a": ["A person who works in a shop", "A person who drives a bus", "A person who bakes bread", "A person who flies a plane"], "k": 0, "scene": "🌙 🛒 🧺"}, {"q": "What does “families” mean in “Their families need help”?", "a": ["Only babies", "Groups of related people", "Groups of workers", "People who live alone"], "k": 1, "scene": "🏠 👨‍👩‍👧‍👦 🤝"}, {"q": "Which word is closest in meaning to “helpful”?", "a": ["Useful", "Greedy", "Noisy", "Lazy"], "k": 0, "scene": "🧒 🤝 🎒"}, {"q": "Which text feature would best explain what a photograph shows?", "a": ["Title", "Caption", "Index number", "Page border"], "k": 1, "scene": "📖 🖼️ 🔍"}, {"q": "Which heading fits a paragraph about nurses working after dark?", "a": ["Nurses at Night", "The Best Picnic", "A Talking Spider", "Our Sunny Garden"], "k": 0, "scene": "🌙 🏥 👩‍⚕️"}, {"q": "Which sentence is nonfiction information?", "a": ["A frog spoke to the moon.", "A spider wore a crown.", "Truck drivers sometimes work at night.", "A tree danced with a boy."], "k": 2, "scene": "📚 🐸 🚚"}, {"q": "Read: “Some workers clean streets at night.” What is the main idea?", "a": ["Street cleaning can happen at night", "Streets are always empty", "Only drivers clean streets", "Night is always noisy"], "k": 0, "scene": "🌙 🧹 🛣️"}, {"q": "What is a character in a story?", "a": ["A person or animal taking part", "The author’s page number", "The title on the cover", "A picture caption"], "k": 0, "scene": "📖 🐻 🧒"}, {"q": "Which word describes someone who takes more than needed?", "a": ["Patient", "Greedy", "Generous", "Polite"], "k": 1, "scene": "🍪 🧒 🍪"}, {"q": "Which action best shows kindness?", "a": ["Taking all the snacks", "Ignoring a friend", "Helping someone who fell", "Laughing at a mistake"], "k": 2, "scene": "🧒 🤝 🧒"}, {"q": "Which pair contains two fictional stories?", "a": ["Who Works at Night? and Neighborhood Helpers", "Spider’s Greed and Snake and Frog", "A science report and a recipe", "A map and a fact sheet"], "k": 1, "scene": "📚 🐍 🕷️"}, {"q": "Which sentence compares two characters?", "a": ["Spider lives in a story.", "Both characters are animals.", "Frog has a name.", "Spider eats food."], "k": 1, "scene": "🕷️ 🔍 🐸"}, {"q": "Which sentence contrasts two characters?", "a": ["Both characters speak.", "Both live outdoors.", "Spider is greedy, but Frog is friendly.", "They are both in stories."], "k": 2, "scene": "🕷️ ↔️ 🐸"}, {"q": "Which sentence states an opinion?", "a": ["The sun rises in the east.", "Many parks have trees.", "Our playground is the most fun place.", "Dogs have four legs."], "k": 2, "scene": "🌳 🛝 🧒"}, {"q": "Which is a reason to support “Children should read every day”?", "a": ["Books have covers", "Reading helps children learn new words", "Some books are blue", "I saw a book yesterday"], "k": 1, "scene": "📚 🧒 💭"}, {"q": "Which sentence gives a clear opinion?", "a": ["I believe every class should have a reading corner.", "Our class has a door.", "A shelf holds books.", "The teacher opened a book."], "k": 0, "scene": "🏫 📚 🪑"}, {"q": "Choose the best word: “I enjoy the library ___ it is quiet.”", "a": ["but", "because", "under", "before"], "k": 1, "scene": "📚 🤫 🧒"}, {"q": "Which sentence best concludes an opinion about gardens?", "a": ["There is a flower.", "I saw a garden yesterday.", "For these reasons, our school should have a garden.", "Some plants are green."], "k": 2, "scene": "🌻 🏫 🌱"}, {"q": "Read: “Ben gave his seat to an older person.” Which trait fits Ben?", "a": ["Helpful", "Greedy", "Careless", "Selfish"], "k": 0, "scene": "🚌 🧒 👵"}, {"q": "Which is a question?", "a": ["Put the bag away.", "What a lovely picture!", "The bag is on the chair.", "Who took the bag?"], "k": 3, "scene": "🎒 🪑 💬"}, {"q": "The ball rolled ___ the sofa, so I could not see it.", "a": ["under", "at noon", "on Tuesday", "in winter"], "k": 0, "scene": "🛋️ ⚽ 🔍"}, {"q": "The film begins ___ 6:30.", "a": ["in", "on", "at", "behind"], "k": 2, "scene": "🎬 🕡 🍿"}, {"q": "We have music class ___ Thursday.", "a": ["in", "at", "on", "under"], "k": 2, "scene": "🎵 📅 🎹"}, {"q": "Flowers bloom ___ spring.", "a": ["on", "in", "at", "between"], "k": 1, "scene": "🌷 🌱 🦋"}, {"q": "Which sentence correctly lists three things?", "a": ["We need paper, glue, and scissors.", "We need paper glue, and scissors.", "We need paper, glue and, scissors.", "We need, paper glue and scissors."], "k": 0, "scene": "📄 🧴 ✂️"}, {"q": "Which date uses a comma correctly?", "a": ["April, 12 2026", "April 12 2026", "April 12, 2026", "April, 12, 2026"], "k": 2, "scene": "📅 ✏️ 🗓️"}, {"q": "Which word means “paint again”?", "a": ["Painter", "Painting", "Repaint", "Paintful"], "k": 2, "scene": "🎨 🖌️ 🔄"}, {"q": "Which word means “write again”?", "a": ["Rewrite", "Writer", "Writing", "Written"], "k": 0, "scene": "📝 ✏️ 🔄"}, {"q": "Which word has the suffix -ful?", "a": ["Reread", "Careful", "Undo", "Replay"], "k": 1, "scene": "🔤 🧩 📖"}, {"q": "Which word means “full of colour”?", "a": ["Recolour", "Colourful", "Colouring", "Colourless"], "k": 1, "scene": "🎨 🌈 🖍️"}, {"q": "Which word shows the greatest size?", "a": ["Small", "Tiny", "Large", "Enormous"], "k": 3, "scene": "🐭 🐕 🐘"}, {"q": "Which word shows the strongest sound?", "a": ["Quiet", "Soft", "Loud", "Deafening"], "k": 3, "scene": "🔈 🔉 🔊"}, {"q": "Which sentence is a statement?", "a": ["What a clever idea!", "The nurse works at night.", "Please open the window.", "When does school start?"], "k": 1, "scene": "💬 🏥 🌙"}, {"q": "Which sentence is a command?", "a": ["Is the door open?", "The door is open.", "Please open the door.", "What a heavy door!"], "k": 2, "scene": "🚪 🧒 💬"}, {"q": "Which sentence is an exclamation?", "a": ["What an amazing story!", "Where is my story?", "Read the story.", "The story is long."], "k": 0, "scene": "📖 😮 ✨"}, {"q": "Which sentence has the correct ending mark?", "a": ["Why is the sky blue.", "Why is the sky blue!", "Why is the sky blue?", "Why is the sky blue,"], "k": 2, "scene": "☁️ ☀️ 💬"}, {"q": "Which sentence has correct capitals?", "a": ["my friend Ana likes books.", "My friend ana likes books.", "My friend Ana likes books.", "my Friend Ana likes Books."], "k": 2, "scene": "🧒 📚 ✏️"}, {"q": "Which sentence correctly uses a place preposition?", "a": ["The pencil is in Monday.", "The pencil is under the desk.", "The pencil is at April.", "The pencil is on 8 o’clock."], "k": 1, "scene": "✏️ 🪑 🔍"}, {"q": "Which order makes a clear opinion paragraph?", "a": ["Reason, closing, opinion", "Opinion, reasons, closing", "Closing, opinion, reasons", "Reasons, closing, title"], "k": 1, "scene": "📝 🧩 📄"}, {"q": "When answering a comprehension question, what should you do first?", "a": ["Choose randomly", "Read the question and look back at the text", "Copy a classmate", "Pick the shortest answer"], "k": 1, "scene": "📖 🔍 🧒"}];let i=0,answers=Array(40).fill(null);const g=document.getElementById('game');const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const score=()=>answers.filter((a,j)=>a===Q[j].k).length;const done=()=>answers.filter(a=>a!==null).length;function speak(){if(!('speechSynthesis'in window)){alert('Read aloud is not available in this browser.');return}speechSynthesis.cancel();let q=Q[i],u=new SpeechSynthesisUtterance(q.q+' '+q.a.map((a,j)=>String.fromCharCode(65+j)+'. '+a).join('. '));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function go(j){if('speechSynthesis'in window)speechSynthesis.cancel();i=j;render()}function pick(j){if(answers[i]!==null)return;answers[i]=j;render()}function render(){let q=Q[i],a=answers[i];g.innerHTML=`<small> ${['Word & Story Village','Reading & Opinion Library','Grammar Workshop','Writing & Word Castle'][Math.floor(i/10)]}</small><div class="nav"><b>Mission ${i+1} / 40</b><b>⭐ ${score()} stars • ${score()*2.5}/100</b></div><div class="bar"><div class="fill" style="width:${done()/40*100}%"></div></div><div class="scene" role="img" aria-label="Picture clues for this question">${q.scene}</div><h2>${esc(q.q)}</h2><button onclick="speak()">🔊 Read aloud</button><p><small>Choose one answer.</small></p><div class="choices">${q.a.map((v,j)=>`<button class="choice ${a!==null?(j===q.k?'correct':j===a?'wrong':''):''}" onclick="pick(${j})" ${a!==null?'aria-disabled="true"':''}><span class="letter">${String.fromCharCode(65+j)}</span>${esc(v)}</button>`).join('')}</div><div class="feedback" aria-live="polite">${a===null?'':a===q.k?'⭐ Great job! You earned a star.':'Keep learning! Correct answer: '+esc(q.a[q.k])}</div><div class="nav"><button onclick="go(${i-1})" ${i===0?'disabled':''}>← Previous</button><button class="primary" onclick="${i===39?'finish()':`go(${i+1})`}">${i===39?'See results':'Next →'}</button></div><div class="trail">${Q.map((v,j)=>`<button aria-label="Question ${j+1}" class="${j===i?'current':''}" onclick="go(${j})">${answers[j]===v.k?'⭐':answers[j]!==null?'✓':j+1}</button>`).join('')}</div>`}function finish(){if(done()<40){if(!confirm('You have '+(40-done())+' unanswered questions. Finish anyway?'))return}g.innerHTML=`<h1>🏆 Adventure complete!</h1><h2>${score()*2.5} / 100 points</h2><p>${score()} of 40 correct • ${done()} answered</p><div class="nav"><button onclick="go(0)">Review in game</button><button class="primary" onclick="answers.fill(null);go(0)">Play again</button></div><h2>Answer review</h2>${Q.map((q,j)=>`<p><b>${j+1}. ${esc(q.q)}</b><br>${answers[j]===q.k?'⭐ Correct':answers[j]===null?'Not answered':'Your answer: '+esc(q.a[answers[j]])}<br>Correct: ${esc(q.a[q.k])}</p>`).join('')}`}render();</script></html>
